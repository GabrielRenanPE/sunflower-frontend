# ═══════════════════════════════════════════════════════════════════════════════
#  SUNFLOWER — Configuração do Broker Mosquitto (Desenvolvimento Local)
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Como usar:
#    1. Instale o Mosquitto: https://mosquitto.org/download/
#       Ou via winget: winget install EclipseFoundation.Mosquitto
#    2. Rode com: mosquitto -v -c mosquitto/mosquitto.conf
#    3. O broker vai ouvir na porta 1883 (TCP)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Listener TCP (ESP32 + Node.js se conectam aqui) ─────────────────────────
listener 1883
protocol mqtt

# ─── Sem autenticação (desenvolvimento local) ────────────────────────────────
allow_anonymous true

# ─── Persistência ────────────────────────────────────────────────────────────
persistence true
persistence_location ./mosquitto/data/

# ─── Logs (verbose para debug) ──────────────────────────────────────────────
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ─── Retained messages ──────────────────────────────────────────────────────
# O ESP32 publica status "online"/"offline" com retain=true
# Isso garante que clientes novos recebam o último status ao se conectar
retain_available true

# ─── Limites de conexão ─────────────────────────────────────────────────────
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
